</style>

    ["心疼，然后看看能不能帮上忙", "elephant"],
    ["先去查查全貌，看是不是真的", "owl"],
    ["赶紧划走，不敢看", "hedgehog"]]],
  ["在朋友圈子里，你更像哪个角色？", [
    ["情绪树洞，大家有事都找你", "elephant"],
    ["气氛雷达，谁不对劲你第一个知道", "deer"],
    ["军师，理性分析担当", "owl"],
    ["慢热的那个，熟了才会掏心", "hedgehog"]]],
  ["社交了一整天回到家，你最需要的是？", [
    ["一个人待着，把今天每个人的反应再过一遍", "deer"],
    ["找个人倒一倒今天吸收的坏情绪", "sheep"],
    ["洗个热水澡，立刻满血", "elephant"],
    ["关掉手机，谁的消息都先不回", "hedgehog"]]],
  ["如果可以选一种超能力，你选？", [
    ["关掉别人情绪的开关", "hedgehog"],
    ["读心术", "deer"],
    ["治愈别人", "elephant"],
    ["时间暂停，让我想清楚再回应", "owl"]]]
];

let idx = 0;
let answers = [];

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  window.scrollTo(0, 0);
}

function start() { idx = 0; answers = []; render(); show("s-quiz"); }

function render() {
  const [title, opts] = QS[idx];
  document.getElementById("bar").style.width = (idx / QS.length * 100) + "%";
  document.getElementById("count").textContent = (idx + 1) + " / " + QS.length;
  document.getElementById("back").disabled = idx === 0;
  document.getElementById("qtitle").textContent = title;
  const box = document.getElementById("opts");
  box.innerHTML = "";
  opts.forEach(([text, type]) => {
    const b = document.createElement("button");
    b.className = "opt" + (answers[idx] === type ? " picked" : "");
    b.textContent = text;
    b.onclick = () => pick(type, b);
    box.appendChild(b);
  });
}

function pick(type, el) {
  answers[idx] = type;
  el.classList.add("picked");
  setTimeout(() => {
    if (idx < QS.length - 1) { idx++; render(); }
    else finish();
  }, 220);
}

function back() { if (idx > 0) { idx--; render(); } }

function finish() {
  document.getElementById("bar").style.width = "100%";
  show("s-loading");
  const spin = document.getElementById("spin");
  let k = 0;
  const t = setInterval(() => { spin.textContent = TYPES[ORDER[k++ % 5]].emoji; }, 260);
  setTimeout(() => { clearInterval(t); result(); }, 1800);
}

function result() {
  const score = {};
  ORDER.forEach(k => score[k] = 0);
  answers.forEach(t => score[t]++);
  const top = ORDER.reduce((a, b) => score[b] > score[a] ? b : a);
  const T = TYPES[top];
  document.documentElement.style.setProperty("--accent", T.color);
  document.documentElement.style.setProperty("--accent-soft", T.soft);

  document.getElementById("rcard").innerHTML = `
    <div class="tag">我的共情小动物是</div>
    <div class="big">${T.emoji}</div>
    <h2>${T.name}</h2>
    <span class="type" style="background:${T.soft};color:${T.color}">${T.kind}</span>
    <div class="line1">${T.line}</div>
    <div class="tags">${T.tags}</div>
    <div class="brand">共情小动物测试</div>`;

  const dist = ORDER.slice().sort((a, b) => score[b] - score[a]).map(k => {
    const pc = Math.round(score[k] / QS.length * 100);
    return `<div class="row"><span class="nm">${TYPES[k].emoji} ${TYPES[k].name.slice(-2)}</span>
      <span class="tr"><i style="width:${pc}%;background:${TYPES[k].color}"></i></span>
      <span class="pc">${pc}%</span></div>`;
  }).join("");

  const tips = T.tips.map(([h, p, s]) =>
    `<li><b>${h}</b>${p}${s ? `<span class="src">参考：${s}</span>` : ""}</li>`).join("");

  document.getElementById("rbody").innerHTML = `
    <div class="sec"><h3>你的共情画像</h3><p>${T.portrait}</p></div>
    <div class="sec dist"><h3>你的共情成分</h3>${dist}</div>
    <div class="sec"><h3>✨ 你的超能力</h3><p>${T.power}</p></div>
    <div class="sec"><h3>🔋 最消耗你的地方</h3><p>${T.drain}</p></div>
    <div class="sec"><h3>给你的 3 个小方法</h3><ol>${tips}</ol></div>
    <div class="sec"><h3>送你一句话</h3><p class="quote">${T.quote}</p></div>
    <div class="sec"><h3>和其他小动物</h3><div class="pair">
      <div><b>最佳搭档</b>${T.best}</div>
      <div><b>相处要小心</b>${T.careful}</div></div></div>`;
  show("s-result");
}

function restart() {
  document.documentElement.style.removeProperty("--accent");
  document.documentElement.style.removeProperty("--accent-soft");
  show("s-intro");
}
</script>
</body>
</html>
